# Push a tag like v0.1.0 and GitHub builds Aurora.exe and attaches it to a release.
# Repository secrets AURORA_API_ID and AURORA_API_HASH get compiled into the exe.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        env:
          AURORA_API_ID: ${{ secrets.AURORA_API_ID }}
          AURORA_API_HASH: ${{ secrets.AURORA_API_HASH }}
        run: dotnet publish src/Aurora -c Release -r win-x64 -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora
          path: dist/Aurora.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Aurora.exe
